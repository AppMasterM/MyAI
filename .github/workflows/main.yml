name: MyAI Signed Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build signed MyAI APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build React frontend
        run: npm run build

      - name: Generate Android project if needed
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Restore and verify release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "ERROR: Required GitHub secret $name is empty or unavailable."
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/myai-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "ERROR: The restored keystore is empty."
            exit 1
          fi

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          keytool -certreq \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -file "$RUNNER_TEMP/myai-test.csr" >/dev/null

          rm -f "$RUNNER_TEMP/myai-test.csr"

          echo "MYAI_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Keystore and signing credentials verified."

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -s "$MYAI_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: Android apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"
          echo "APK signature verification passed."

      - name: Upload signed MyAI release APK
        uses: actions/upload-artifact@v4
        with:
          name: MyAI-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
